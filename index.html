/* Évaluation atelier — univers Monsieur A (tablette tactile, hors ligne)
   Mise en page : barre marine en haut, grille d'évaluation au centre, barre de note collée en bas. */
:root{
  --marine:#14365D; --vert-ma:#1B6B3A; --texte:#2B2F33; --gris:#6B7280; --fond:#F3F5F9; --carte:#FFFFFF; --trait:#DDE3EC;
  --objectif:#D81B60; --cours:#1E6FD9; --turquoise:#00838F; --jaune:#FFC107; --orange:#EF6C00; --rouge:#D32F2F;
  --pomme:#7CB342; --brique:#A0522D; --violet:#7B1FA2; --indigo:#3949AB; --bravo:#1B8A3C;
  --n0:var(--rouge); --n1:var(--orange); --n2:var(--jaune); --n3:var(--bravo); --ne:#8A93A3;
  --f-titre:"Montserrat","Arial Black",Arial,sans-serif; --f-sous:"Roboto",Arial,sans-serif; --f-texte:"Open Sans",Arial,"Segoe UI",sans-serif;
  --r:12px; --barre:58px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--fond);color:var(--texte);font:15px/1.4 var(--f-texte);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--cours);outline-offset:2px}
.nosel{user-select:none;-webkit-user-select:none}
h1,h2,h3{font-family:var(--f-titre);color:var(--marine);margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

/* ---------- Barre du haut ---------- */
#top{position:sticky;top:0;z-index:30;background:var(--marine);color:#fff;padding:0 max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px))}
#top .in{display:flex;align-items:center;gap:12px;height:var(--barre)}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo img{width:40px;height:40px;border-radius:50%;border:3px solid var(--vert-ma);background:var(--vert-ma);flex:none}
.logo b{font:800 17px/1.05 var(--f-titre);white-space:nowrap}
.logo small{display:block;font:500 11px/1.2 var(--f-sous);letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.groupe-sel{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border-radius:10px;padding:4px 4px 4px 10px;min-width:0}
.groupe-sel label{font:500 11px var(--f-sous);text-transform:uppercase;letter-spacing:.06em;opacity:.8}
.groupe-sel select{background:transparent;border:0;color:#fff;font:700 15px var(--f-sous);max-width:210px;padding:6px 4px}
.groupe-sel select option{color:var(--texte)}
nav.onglets{display:flex;gap:4px;margin-left:auto}
nav.onglets button{background:transparent;border:0;color:#fff;opacity:.78;font:700 14px var(--f-sous);padding:9px 12px;border-radius:9px;display:flex;align-items:center;gap:6px;min-height:42px}
nav.onglets button[aria-current="page"]{opacity:1;background:rgba(255,255,255,.16)}
nav.onglets svg{width:18px;height:18px}
.actions-top{display:flex;gap:6px}
.btn-top{background:#fff;color:var(--marine);border:0;border-radius:9px;font:700 14px var(--f-sous);padding:9px 12px;display:flex;align-items:center;gap:6px;min-height:42px}
.btn-top.vert{background:var(--bravo);color:#fff}
.btn-top svg{width:18px;height:18px}
.confettis{display:flex;gap:6px;justify-content:center;position:absolute;left:0;right:0;bottom:-4px;pointer-events:none}
.confettis i{width:7px;height:7px;border-radius:50%;display:block}
#etat{font:500 12px var(--f-sous);opacity:.75;white-space:nowrap}
#etat.alerte{opacity:1;background:var(--orange);color:#fff;padding:3px 8px;border-radius:6px}

/* ---------- Bandeau grilles ---------- */
.bandeau{background:var(--carte);border-bottom:1px solid var(--trait);padding:8px max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px;position:sticky;top:var(--barre);z-index:20}
.annees{display:flex;background:var(--fond);border-radius:10px;padding:3px;flex:none}
.annees button{border:0;background:transparent;font:700 14px var(--f-sous);padding:8px 12px;border-radius:8px;color:var(--gris);min-height:40px;white-space:nowrap}
.annees button[aria-pressed="true"]{background:var(--marine);color:#fff}
.pps{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding:2px;min-width:0;flex:1}
.pp{flex:none;border:2px solid var(--trait);background:#fff;border-radius:10px;min-width:48px;height:42px;padding:0 9px;font:800 15px var(--f-titre);color:var(--marine);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;position:relative}
.pp small{font:600 10px var(--f-sous);color:var(--gris);margin-top:2px}
.pp.sub{min-width:44px;font-size:13px;border-style:dashed}
.pp[aria-pressed="true"]{background:var(--marine);border-color:var(--marine);color:#fff}
.pp[aria-pressed="true"] small{color:#cfd8e6}
.pp .jauge{position:absolute;left:6px;right:6px;bottom:3px;height:3px;border-radius:2px;background:var(--trait);overflow:hidden}
.pp .jauge i{display:block;height:100%;background:var(--bravo)}
.pp[aria-pressed="true"] .jauge{background:rgba(255,255,255,.25)}
.pp[aria-pressed="true"] .jauge i{background:var(--jaune)}

/* ---------- Mise en page Évaluer ---------- */
#app{padding:12px max(14px,env(safe-area-inset-right,0px)) calc(86px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.eval{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px;align-items:start}
.liste{background:var(--carte);border:1px solid var(--trait);border-radius:var(--r);overflow:hidden;position:sticky;top:calc(var(--barre) + 70px);max-height:calc(100vh - var(--barre) - 170px);display:flex;flex-direction:column}
.liste h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:10px 12px;border-bottom:1px solid var(--trait);display:flex;justify-content:space-between;color:var(--gris);font-family:var(--f-sous)}
.liste ol{list-style:none;margin:0;padding:4px;overflow-y:auto}
.app-btn{width:100%;display:flex;align-items:center;gap:8px;border:0;background:transparent;text-align:left;padding:8px 8px;border-radius:9px;min-height:46px}
.app-btn[aria-current="true"]{background:#E6EEF9;box-shadow:inset 3px 0 0 var(--cours)}
.app-btn .nm{flex:1;min-width:0;font-weight:600;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app-btn .nm b{font-family:var(--f-sous);font-weight:700;text-transform:uppercase;font-size:14px}
.app-btn .rg{font:600 11px var(--f-sous);color:var(--gris);width:18px;text-align:right}
.pastille{font:800 13px var(--f-titre);min-width:50px;text-align:center;padding:5px 6px;border-radius:8px;background:var(--fond);color:var(--gris)}
.pastille.b0{background:#FDE7E7;color:var(--rouge)}.pastille.b1{background:#FDEEDC;color:#B45309}.pastille.b2{background:#FFF4CC;color:#7A5A00}.pastille.b3{background:#E2F3E7;color:var(--bravo)}
.pastille.inc{outline:2px dashed currentColor;outline-offset:-2px}
.chips-app{display:none}

.fiche{display:flex;flex-direction:column;gap:12px;min-width:0}
.entete{background:var(--carte);border:1px solid var(--trait);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px}
.entete .pp-num{font:700 12px var(--f-sous);letter-spacing:.08em;text-transform:uppercase;color:var(--objectif)}
.entete h2{font-size:20px;line-height:1.2;margin-top:2px}
.entete .st{color:var(--gris);font:500 14px var(--f-sous);margin-top:3px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.meta span{background:var(--fond);border-radius:7px;padding:3px 8px;font:500 13px var(--f-sous);color:var(--texte)}
.meta span b{color:var(--gris);font-weight:500}
.qui{display:flex;flex-direction:column;align-items:flex-end;gap:6px;text-align:right}
.qui .nom{font:800 19px var(--f-titre);color:var(--marine);line-height:1.1}
.qui .nom span{font:600 17px var(--f-sous);color:var(--texte)}
.champs{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.champ{display:flex;flex-direction:column;gap:2px;font:600 11px var(--f-sous);color:var(--gris);text-transform:uppercase;letter-spacing:.05em}
.champ input{border:1px solid var(--trait);border-radius:8px;padding:6px 8px;font:500 14px var(--f-sous);color:var(--texte);background:#fff;min-height:38px;text-transform:none;letter-spacing:0;width:150px}
.champ input[type=date]{width:155px}
.verif{grid-column:1/-1;display:flex;gap:8px;align-items:flex-start;background:#FDF0E3;border:1px solid #F5C7A0;border-radius:9px;padding:7px 10px;font-size:13px;color:#7A3B00}
.verif b{color:var(--orange);font-family:var(--f-sous);white-space:nowrap}

/* Bloc de compétence */
.bloc{background:var(--carte);border:1px solid var(--trait);border-radius:var(--r);overflow:hidden}
.bloc-h{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#EEF3FA;border-bottom:1px solid var(--trait)}
.bloc.socio .bloc-h{background:#F2ECF7}
.code{font:800 13px var(--f-titre);color:#fff;background:var(--cours);border-radius:7px;padding:4px 8px;flex:none}
.bloc.socio .code{background:var(--violet)}
.bloc-h .lib{flex:1;min-width:0;font:700 15px/1.2 var(--f-sous);color:var(--marine)}
.bloc-h .poids{font:600 12px var(--f-sous);color:var(--gris);white-space:nowrap}
.res{display:flex;align-items:center;gap:6px;font:800 13px var(--f-titre);min-width:92px;justify-content:flex-end}
.res .barre{width:46px;height:7px;border-radius:4px;background:var(--trait);overflow:hidden}
.res .barre i{display:block;height:100%}
.remplir{border:1px solid var(--trait);background:#fff;border-radius:8px;font:700 12px var(--f-sous);padding:6px 9px;color:var(--marine);min-height:36px;white-space:nowrap}
.tache{padding:6px 12px 2px;font:700 12px var(--f-sous);text-transform:uppercase;letter-spacing:.06em;color:var(--brique)}
.poste{display:grid;grid-template-columns:minmax(0,1fr) auto 40px;align-items:center;gap:6px 10px;padding:6px 8px 6px 12px;border-top:1px solid #EEF1F5}
.tache + .poste{border-top:0}
.poste .pl{min-width:0}
.poste .pl b{font-weight:600;display:block;line-height:1.25}
.tol{display:inline-block;margin-top:2px;font:500 12px var(--f-sous);color:var(--turquoise);background:#E0F2F3;border-radius:6px;padding:1px 7px}
.niv{display:flex;gap:4px}
.niv button{width:52px;height:44px;border-radius:9px;border:2px solid var(--c);background:#fff;color:var(--ct,var(--c));font:800 14px var(--f-titre);padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.niv button small{font:600 9px var(--f-sous);margin-top:2px;letter-spacing:.02em}
.niv button[aria-pressed="true"]{background:var(--c);color:var(--ctf,#fff)}
.niv .l-ne{--c:var(--ne)}.niv .l0{--c:var(--n0)}.niv .l1{--c:var(--n1)}.niv .l2{--c:var(--n2);--ct:#8A6400;--ctf:var(--texte)}.niv .l3{--c:var(--n3)}
.niv .l-ne[aria-pressed="true"]{background:var(--ne)}
.obs-btn{width:40px;height:40px;border-radius:9px;border:1px solid var(--trait);background:#fff;color:var(--gris);display:flex;align-items:center;justify-content:center;position:relative;padding:0}
.obs-btn svg{width:19px;height:19px}
.obs-btn.a{color:var(--cours);border-color:var(--cours)}
.obs-btn.a::after{content:"";position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--objectif)}
.obs{grid-column:1/-1}
.obs textarea{width:100%;min-height:44px;border:1px solid var(--trait);border-radius:8px;padding:7px 9px;resize:vertical;font-size:14px}
.fiche.commence .poste.vide .pl b::before{content:"◄ ";color:var(--orange);font-size:11px}

/* Bilan */
.bilan{background:var(--carte);border:1px solid var(--trait);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:12px}
.bilan label{font:700 12px var(--f-sous);text-transform:uppercase;letter-spacing:.06em;color:var(--gris);display:block;margin-bottom:4px}
.bilan textarea,.bilan input[type=text]{width:100%;border:1px solid var(--trait);border-radius:8px;padding:8px 10px;font-size:15px;background:#fff}
.bilan textarea{min-height:76px;resize:vertical;overflow:hidden;line-height:1.45}
.bilan .g{display:flex;flex-direction:column;gap:10px;min-width:0}
.photo{border:2px dashed var(--trait);border-radius:10px;min-height:170px;display:flex;align-items:stretch;justify-content:center;position:relative;overflow:hidden;background:var(--fond)}
.photo img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;cursor:zoom-in}
.photo .ph-actions{position:absolute;bottom:6px;right:6px;left:6px;display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.photo .ajout{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;background:transparent;color:var(--marine);cursor:pointer;padding:16px 16px 34px;text-align:center;min-height:166px}
.photo .ajout svg{width:44px;height:44px}
.photo .ajout b{font:800 17px var(--f-titre)}
.photo .ajout small{font:500 12px var(--f-sous);color:var(--gris)}
.photo .ajout:active{background:#E6EEF9}
.photo .ph-fichier{position:absolute;bottom:6px;left:0;right:0;text-align:center;font:600 12px var(--f-sous);color:var(--cours);text-decoration:underline;cursor:pointer;text-transform:none;letter-spacing:0;margin:0;padding:4px}
.lab-ligne{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.lab-ligne label{margin-bottom:0}
.mini-lien{border:0;background:none;color:var(--cours);font:600 12px var(--f-sous);padding:4px 0;min-height:30px;text-decoration:underline}
.mini svg{width:14px;height:14px;vertical-align:-2px;margin-right:4px}
#camera{position:fixed;inset:0;z-index:90;background:#000;color:#fff}
#camera video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#camera .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .15s}
#camera .flash.on{opacity:.85}
.cam-haut{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(0,0,0,.55),transparent);font:500 16px var(--f-sous)}
.cam-x{width:52px;height:52px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font:400 34px/1 var(--f-sous)}
.cam-bas{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:16px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,rgba(0,0,0,.55))}
.declencheur{width:88px;height:88px;border-radius:50%;border:6px solid #fff;background:transparent;padding:6px;display:flex}
.declencheur i{flex:1;border-radius:50%;background:#fff;transition:transform .1s}
.declencheur:active i{transform:scale(.88)}
.declencheur:disabled{opacity:.4}
.cam-fichier{font:600 14px var(--f-sous);color:#fff;text-decoration:underline;cursor:pointer;justify-self:start;padding:10px 0}
.cam-msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center;font:500 17px var(--f-sous);background:#14365D}
.mini{border:0;border-radius:8px;background:rgba(20,54,93,.85);color:#fff;font:700 12px var(--f-sous);padding:7px 10px;min-height:34px}

/* Barre de note en bas */
#note-bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;border-top:1px solid var(--trait);box-shadow:0 -6px 18px rgba(20,54,93,.08);padding:8px max(14px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
#note-bar .in{display:flex;align-items:center;gap:14px}
.note-big{display:flex;align-items:baseline;gap:3px;font-family:var(--f-titre);color:var(--marine)}
.note-big b{font-size:34px;font-weight:800;line-height:1}
.note-big span{font-size:16px;font-weight:700;color:var(--gris)}
.anneau{width:54px;height:54px;flex:none}
.appr{min-width:0;flex:1}
.appr b{display:block;font:800 15px/1.15 var(--f-titre);color:var(--marine);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appr span{font:500 13px var(--f-sous);color:var(--gris)}
.appr span.ok{color:var(--bravo)} .appr span.ko{color:var(--orange)}
.avatar-note{height:58px;margin:-14px 0 -8px;flex:none}
.nav-app{display:flex;gap:6px}
.nav-app button{border:0;border-radius:10px;background:var(--fond);color:var(--marine);font:700 15px var(--f-sous);min-height:48px;padding:0 14px;display:flex;align-items:center;gap:6px}
.nav-app button.suiv{background:var(--marine);color:#fff}
.nav-app svg{width:20px;height:20px}

/* ---------- Synthèse ---------- */
.vue-titre{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.vue-titre h2{font-size:21px}
.vue-titre .sp{flex:1}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.kpi{background:var(--carte);border:1px solid var(--trait);border-radius:var(--r);padding:9px 14px;min-width:150px}
.kpi b{display:block;font:800 24px var(--f-titre);color:var(--marine);line-height:1.1}
.kpi span{font:500 12px var(--f-sous);color:var(--gris)}
.tab-wrap{overflow:auto;background:var(--carte);border:1px solid var(--trait);border-radius:var(--r);max-height:calc(100vh - var(--barre) - 240px)}
table.synth{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
.synth th,.synth td{padding:6px 6px;border-bottom:1px solid #EEF1F5;text-align:center;white-space:nowrap}
.synth thead th{position:sticky;top:0;background:#EEF3FA;z-index:2;font:800 13px var(--f-titre);color:var(--marine)}
.synth thead th small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font:500 10px var(--f-sous);color:var(--gris);max-width:92px;white-space:normal;line-height:1.15;margin-top:2px}
.synth th.n,.synth td.n{text-align:left;position:sticky;left:0;background:#fff;z-index:1;font-weight:600;min-width:170px}
.synth thead th.n{z-index:3;background:#EEF3FA}
.synth td button{border:0;background:transparent;padding:0;width:100%}
.synth tfoot td{background:#F7F9FC;font:700 13px var(--f-sous);color:var(--marine);position:sticky;bottom:0}
.synth tfoot td.n{background:#F7F9FC}
.cell{display:inline-block;min-width:48px;padding:5px 4px;border-radius:7px;font:800 13px var(--f-titre)}
.cell.vide{color:#C3CAD5;font-weight:600}
.cell.b0{background:#FDE7E7;color:var(--rouge)}.cell.b1{background:#FDEEDC;color:#B45309}.cell.b2{background:#FFF4CC;color:#7A5A00}.cell.b3{background:#E2F3E7;color:var(--bravo)}
.cell.inc{outline:2px dashed currentColor;outline-offset:-2px}
.legende{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font:500 12px var(--f-sous);color:var(--gris);align-items:center}
.legende .cell{min-width:auto;padding:2px 8px}

/* ---------- Suivi ---------- */
.suivi{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:var(--r);padding:12px 14px;min-width:0}
.carte h3{font-size:15px;margin-bottom:8px}
.sel-app{display:flex;gap:6px;align-items:center}
.sel-app select{border:1px solid var(--trait);border-radius:9px;padding:8px 10px;font:700 15px var(--f-sous);min-height:44px;background:#fff;max-width:280px}
.sel-app button{border:1px solid var(--trait);background:#fff;border-radius:9px;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center}
.sel-app svg{width:20px;height:20px}
.graph svg{width:100%;height:auto;display:block}
.comp{display:grid;grid-template-columns:52px minmax(0,1fr) 120px 44px;gap:6px 10px;align-items:center;padding:5px 0;border-bottom:1px solid #EEF1F5}
.comp .c{font:800 12px var(--f-titre);color:#fff;background:var(--cours);border-radius:6px;padding:3px 0;text-align:center}
.comp .l{font-size:13px;line-height:1.2}
.comp .l small{color:var(--gris);display:block}
.comp .b{height:10px;border-radius:5px;background:var(--trait);overflow:hidden}
.comp .b i{display:block;height:100%}
.comp .p{font:800 13px var(--f-titre);text-align:right}
.obs-liste{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow:auto}
.obs-liste div{border-left:4px solid var(--cours);background:var(--fond);border-radius:0 8px 8px 0;padding:6px 10px;font-size:14px;white-space:pre-line}
.obs-liste div b{font:700 12px var(--f-sous);color:var(--marine);display:block}
.vide-msg{color:var(--gris);font-size:14px;padding:8px 0}

/* ---------- Réglages ---------- */
.reglages{display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px;align-items:start}
.sous-nav{display:flex;flex-direction:column;gap:4px;background:var(--carte);border:1px solid var(--trait);border-radius:var(--r);padding:6px}
.sous-nav button{border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:9px;font:700 14px var(--f-sous);color:var(--marine);min-height:44px}
.sous-nav button[aria-current="page"]{background:#E6EEF9}
.form-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
.form-row label{display:flex;flex-direction:column;gap:3px;font:600 12px var(--f-sous);color:var(--gris);min-width:0;max-width:100%}
.form-row .inp{max-width:100%}
.inp{border:1px solid var(--trait);border-radius:8px;padding:8px 10px;min-height:42px;background:#fff;font-size:15px}
.btn{border:1px solid var(--trait);background:#fff;border-radius:9px;padding:9px 14px;font:700 14px var(--f-sous);color:var(--marine);min-height:44px;display:inline-flex;align-items:center;gap:6px}
.btn.prim{background:var(--marine);border-color:var(--marine);color:#fff}
.btn.vert{background:var(--bravo);border-color:var(--bravo);color:#fff}
.btn.danger{color:var(--rouge);border-color:#F2B8B8}
.btn.danger.on{background:var(--rouge);color:#fff;border-color:var(--rouge)}
.btn svg{width:18px;height:18px}
.tbl-app{width:100%;border-collapse:collapse}
.tbl-app td{padding:4px;border-bottom:1px solid #EEF1F5}
.tbl-app td.rg{width:30px;color:var(--gris);font:600 12px var(--f-sous);text-align:right}
.tbl-app input{width:100%}
.aide{background:#E9F1FC;border:1px solid #BCD3F3;border-radius:10px;padding:9px 12px;font-size:14px;margin:8px 0}
.aide b{color:var(--cours);font-family:var(--f-sous)}
.attention-blk{background:#FDF0E3;border:1px solid #F5C7A0;border-radius:10px;padding:9px 12px;font-size:14px;margin:8px 0;color:#6B3500}
.ed-bloc{border:1px solid var(--trait);border-radius:10px;margin:10px 0;overflow:hidden}
.ed-bloc .h{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:#EEF3FA;padding:8px}
.ed-bloc .t{padding:6px 8px;border-top:1px solid #EEF1F5}
.ed-poste{display:grid;grid-template-columns:minmax(0,1fr) 170px 74px 40px;gap:6px;margin:4px 0}
.ed-poste input,.ed-bloc input{min-height:38px;padding:6px 8px}
.ico{border:1px solid var(--trait);background:#fff;border-radius:8px;min-width:38px;min-height:38px;display:inline-flex;align-items:center;justify-content:center;color:var(--rouge);padding:0}
.ico svg{width:17px;height:17px}
.total{font:700 13px var(--f-sous);padding:4px 8px;border-radius:6px;background:var(--fond)}
.total.ko{background:#FDEEDC;color:#B45309}

/* ---------- Accueil ---------- */
.accueil{max-width:860px;margin:30px auto;background:var(--carte);border:1px solid var(--trait);border-radius:18px;padding:26px;display:grid;grid-template-columns:200px minmax(0,1fr);gap:22px;align-items:center}
.accueil img{width:100%;height:auto}
.accueil h2{font-size:28px;line-height:1.15}
.accueil p{font-size:16px;max-width:60ch}
.accueil .etapes{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.accueil .etapes div{display:flex;gap:10px;align-items:center}
.accueil .etapes i{flex:none;width:30px;height:30px;border-radius:50%;color:#fff;font:800 14px/30px var(--f-titre);text-align:center;font-style:normal}

/* Popover, modale, toast */
#pop{position:fixed;z-index:60;background:#fff;border:1px solid var(--trait);border-radius:12px;box-shadow:0 12px 32px rgba(20,54,93,.2);padding:6px;display:flex;flex-direction:column;gap:2px;min-width:230px}
#pop button{border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:8px;font:600 14px var(--f-sous);min-height:44px;display:flex;gap:8px;align-items:center}
#pop button:hover{background:var(--fond)}
#pop i{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
#voile{position:fixed;inset:0;z-index:50;background:rgba(20,30,45,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modale{background:#fff;border-radius:16px;max-width:560px;width:100%;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.25);max-height:90vh;overflow:auto}
.modale h3{font-size:18px;margin-bottom:8px}
.modale .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.modale img{max-width:100%;border-radius:10px}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--marine);color:#fff;font:700 14px var(--f-sous);padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}

/* ---------- Tablette portrait / petits écrans ---------- */
@media (max-width:1320px){
  .logo small{display:none}
  #etat:not(.alerte){display:none}
}
@media (max-width:1100px){
  nav.onglets button span{display:none}
  .btn-top span{display:none}
}
@media (max-width:980px){
  .logo b{display:none}
  .eval{grid-template-columns:minmax(0,1fr)}
  .liste{display:none}
  .chips-app{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
  .chip-app{flex:none;border:1px solid var(--trait);background:#fff;border-radius:22px;padding:5px 6px 5px 12px;display:flex;align-items:center;gap:6px;font:600 14px var(--f-sous);min-height:42px}
  .chip-app[aria-current="true"]{border-color:var(--cours);background:#E6EEF9}
  .chip-app .pastille{min-width:44px;padding:3px 5px;font-size:12px}
  .suivi{grid-template-columns:minmax(0,1fr)}
  .reglages{grid-template-columns:minmax(0,1fr)}
  .sous-nav{flex-direction:row;overflow-x:auto}
  .bilan{grid-template-columns:minmax(0,1fr)}
  .entete{grid-template-columns:minmax(0,1fr)}
  .qui{align-items:flex-start;text-align:left}
  .champs{justify-content:flex-start}
  .groupe-sel label{display:none}
}
@media (max-width:720px){
  #top .in{flex-wrap:wrap;height:auto;padding:6px 0;gap:6px}
  .groupe-sel{order:5;flex:1 1 100%}
  .groupe-sel select{max-width:none;width:100%}
  .bandeau{top:var(--haut-tel,104px)}
  .bloc-h{flex-wrap:wrap}
  .bloc-h .lib{flex:1 1 calc(100% - 70px)}
  .bloc-h .poids{flex:1 1 auto}
  .liste{top:auto}
  .logo b{display:none}
  .poste{grid-template-columns:minmax(0,1fr) 40px}
  .poste .niv{grid-column:1/-1;order:3}
  .niv button{flex:1}
  .avatar-note,.appr span{display:none}
  .nav-app button span{display:none}
  .accueil{grid-template-columns:minmax(0,1fr)}
  .accueil img{max-width:160px}
  .ed-poste{grid-template-columns:minmax(0,1fr) 74px 40px}
  .ed-poste .tl{grid-column:1/-1;order:2}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Impression (A4) ---------- */
#print{display:none}
@media print{
  @page{size:A4 portrait;margin:9mm}
  @page paysage{size:A4 landscape;margin:9mm}
  body{background:#fff}
  #top,#app,#note-bar,.bandeau,#toast,#pop,#voile{display:none!important}
  #print{display:block}
  .pg{page-break-after:always;break-after:page;font:9pt/1.3 var(--f-texte);color:#000}
  .pg:last-child{page-break-after:auto;break-after:auto}
  .pg.paysage{page:paysage}
}
.pg *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pg .ph{display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--marine);padding-bottom:5px;margin-bottom:6px}
.pg .ph img{width:34px;height:34px;border-radius:50%;border:2px solid var(--vert-ma)}
.pg .ph .t{flex:1}
.pg .ph .t b{font:800 13pt var(--f-titre);color:var(--marine);display:block}
.pg .ph .t span{font:600 8.5pt var(--f-sous);color:var(--gris);letter-spacing:.05em;text-transform:uppercase}
.pg .ph .f{text-align:right;font:600 8.5pt var(--f-sous)}
.pg .id{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:5px}
.pg .id div{border:1px solid #AAB3C2;border-radius:4px;padding:2px 6px;font-size:8.5pt}
.pg .id div b{display:block;font:600 6.5pt var(--f-sous);color:var(--gris);text-transform:uppercase}
.pg .ppt{background:#EEF3FA;border-left:4px solid var(--objectif);padding:4px 8px;margin-bottom:5px}
.pg .ppt b{font:800 10pt var(--f-titre);color:var(--marine)}
.pg .ppt div{font-size:8.5pt;color:#333}
.pg table{width:100%;border-collapse:collapse;margin-bottom:5px}
.pg th,.pg td{border:1px solid #AAB3C2;padding:1.5px 4px;vertical-align:middle;line-height:1.2}
.pg th{background:var(--marine);color:#fff;font:700 7pt var(--f-sous);text-align:center}
.pg td.c{text-align:center;width:22px;font-weight:800}
.pg td.w,.pg td.pt{text-align:right;width:34px;font-variant-numeric:tabular-nums}
.pg td.cp{background:#EEF3FA;font:700 8pt var(--f-sous);color:var(--marine)}
.pg td.tl{color:#00636B;width:110px}
.pg td.ob{width:130px;font-size:7.5pt}
.pg td.x{background:#DDE6F3}
.pg .tot{display:grid;grid-template-columns:120px minmax(0,1fr) 150px;gap:6px;align-items:stretch;margin-top:4px}
.pg .tot > div{border:1px solid #AAB3C2;border-radius:4px;padding:4px 6px}
.pg .tot .n{text-align:center;font:800 18pt var(--f-titre);color:var(--marine)}
.pg .tot .n small{font-size:9pt;color:var(--gris)}
.pg .tot b{font:600 6.5pt var(--f-sous);color:var(--gris);text-transform:uppercase;display:block}
.pg .sig{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.pg .sig div{border:1px solid #AAB3C2;border-radius:4px;height:36px;padding:3px 6px;font:600 7pt var(--f-sous);color:var(--gris)}
.pg .phot{max-height:60mm;max-width:85mm;border-radius:4px;display:block}
.pg .conf{display:flex;gap:4px;justify-content:center;margin-top:6px}
.pg .conf i{width:6px;height:6px;border-radius:50%;display:block}

</style>
</head>

function idStable(texte) {
  let h = 5381; for (let i = 0; i < texte.length; i++) h = ((h << 5) + h + texte.charCodeAt(i)) >>> 0;
  return h.toString(36);

  if (ev.length >= 2) {
    const fort = ev[0], faible = ev[ev.length - 1];
    if (fort.s >= 2 / 3) phr.push(`Point fort : ${fort.b.code} ${minus(fort.b.libelle)} (${Math.round(fort.s * 100)} %).`);
    if (faible.s < 0.6) phr.push(`À renforcer : ${faible.b.code} ${minus(faible.b.libelle)} (${Math.round(faible.s * 100)} %).`);
  }
  const postes = g.blocs.flatMap(b => b.taches.flatMap(t => t.postes));
  const avecTol = p => minus(p.label) + (p.tol && /\d/.test(p.tol) ? ` (${p.tol})` : '');
  const niv = k => postes.filter(p => m[p.id] === k);
  const acquis = niv('A'), notes = postes.filter(p => MAP_T[m[p.id]] && MAP_T[m[p.id]].c != null);
  if (notes.length && acquis.length === notes.length) phr.push('Tous les postes contrôlés sont acquis.');
  else if (acquis.length) phr.push(`Acquis : ${enumere(acquis.map(p => minus(p.label)), 4)}`);
  const atravailler = [...niv('NA'), ...niv('NM')];
  if (atravailler.length) phr.push(`À travailler : ${enumere(atravailler.map(avecTol), 6)}`);
  if (niv('EC').length) phr.push(`En cours d'acquisition : ${enumere(niv('EC').map(avecTol), 4)}`);
  const socioEv = g.socio.filter(p => MAP_S[s[p.id]] && MAP_S[s[p.id]].c != null);
  const socioFaible = g.socio.filter(p => s[p.id] === 'I' || s[p.id] === 'AM').map(p => minus(p.label.replace(/\s*\(.*\)$/, '')));
  if (socioFaible.length) phr.push(`Comportement à améliorer : ${enumere(socioFaible, 4)}`);
  else if (socioEv.length && socioEv.every(p => s[p.id] === 'TS')) phr.push("Comportement exemplaire à l'atelier.");
  else if (socioEv.length) phr.push("Comportement satisfaisant à l'atelier.");
  const rem = [...postes, ...g.socio].filter(p => (o[p.id] || '').trim()).map(p => `${minus(p.label.replace(/\s*\(.*\)$/, ''))} : ${minus(o[p.id].trim().replace(/[.;]+$/, ''))}`);

  const f = $('.fiche'); if (f) f.classList.toggle('commence', !!r.marques);
  $$(`[data-past="${a.id}"]`).forEach(el => { const b = r.marques ? bande(r.note) : -1; el.className = `pastille ${b >= 0 ? 'b' + b : ''} ${r.marques && !r.valide ? 'inc' : ''} num`; el.textContent = r.marques ? f1(r.note) : '—'; });
  const apIn = $('#in-ap'); if (apIn && !(e && e.ap) && document.activeElement !== apIn) apIn.value = appreciationAuto(r.note);
  const ogIn = $('#in-og'); if (ogIn && !(e && e.og) && document.activeElement !== ogIn) ogIn.value = observationAuto(g, e, r); ajuster(ogIn);
  const jg = document.querySelector(`.pp[data-v="${g.id}"] .jauge i`); if (jg) jg.style.width = Math.round(100 * apps.filter(x => resume(x.id, g.id)).length / apps.length) + '%';
}

/* ================= Vue : synthèse ================= */
function vueSynthese() {
  const liste = grillesAnnee(S.annee), apps = apprentis();
  let tot = 0, nb = 0, sup10 = 0, inc = 0;
  const lignes = apps.map(a => {
    const notes = liste.map(g => resume(a.id, g.id));
    const ok = notes.filter(Boolean); const moy = ok.length ? ok.reduce((s, x) => s + x.note, 0) / ok.length : null;
    ok.forEach(x => { tot += x.note; nb++; if (x.note >= 10) sup10++; if (!x.valide) inc++; });
    return `<tr><td class="n"><b>${esc(a.nom)}</b> ${esc(a.prenom)}</td>${notes.map((x, j) => `<td><button data-a="ouvrir" data-app="${a.id}" data-g="${liste[j].id}" aria-label="${esc(a.nom)} ${nomPP(liste[j])}">${x ? `<span class="cell b${bande(x.note)} ${x.valide ? '' : 'inc'}">${f1(x.note)}</span>` : '<span class="cell vide">·</span>'}</button></td>`).join('')}
      <td>${moy != null ? `<span class="cell b${bande(moy)}">${f1(moy)}</span>` : '<span class="cell vide">—</span>'}</td></tr>`;
  }).join('');
  const pied = liste.map(g => { const ok = apps.map(a => resume(a.id, g.id)).filter(Boolean); return `<td>${ok.length ? f1(ok.reduce((s, x) => s + x.note, 0) / ok.length) : ''}</td>`; }).join('');
  return `<div class="vue-titre"><h2>Synthèse · ${esc(groupe().nom)} · ${libAnnee(S.annee)}</h2><span class="sp"></span>
      <button class="btn" data-a="print-synth">${ICO.print}Imprimer la synthèse</button></div>
    <div class="kpis"><div class="kpi"><b class="num">${nb ? f1(tot / nb) : '—'}</b><span>moyenne des fiches</span></div>
      <div class="kpi"><b class="num">${nb}</b><span>fiches évaluées</span></div>
      <div class="kpi"><b class="num">${nb ? pc(sup10 / nb) : '—'}</b><span>fiches à 10 ou plus</span></div>
      <div class="kpi"><b class="num">${inc}</b><span>fiches évaluées à moins de 2/3</span></div></div>
    <div class="tab-wrap"><table class="synth"><thead><tr><th class="n">Apprenti</th>${liste.map(g => `<th>${nomPP(g)}<small>${esc(g.titre)}</small></th>`).join('')}<th>Moyenne</th></tr></thead>
      <tbody>${lignes}</tbody><tfoot><tr><td class="n">Moyenne du groupe</td>${pied}<td></td></tr></tfoot></table></div>
    <div class="legende"><span class="cell b3">12 et +</span><span class="cell b2">10 à 12</span><span class="cell b1">8 à 10</span><span class="cell b0">moins de 8</span><span class="cell b2 inc">pointillés</span> = moins de 2/3 évalué · touchez une note pour ouvrir la fiche</div>`;
}

/* ================= Vue : suivi d'un apprenti ================= */
function vueSuivi() {
  const apps = apprentis(), a = apprenti();
  if (!a) return '<p class="vide-msg">Aucun apprenti.</p>';
  const i = apps.findIndex(x => x.id === a.id);
  const toutes = ORIGINE.map(g => grille(g.id));
  // Graphique des notes
  const W = 30, H = 170, m = { g: 30, h: 12, b: 34 }, larg = m.g + toutes.length * W + 10;
  const y = v => m.h + (H - m.h - m.b) * (1 - v / 20);
  let svg = `<svg viewBox="0 0 ${larg} ${H}" role="img" aria-label="Notes par pratique professionnelle">`;
  [0, 5, 10, 15, 20].forEach(v => { svg += `<line x1="${m.g}" x2="${larg - 6}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 10 ? '#AAB3C2' : '#E3E8F0'}" stroke-dasharray="${v === 10 ? '4 3' : ''}"/><text x="${m.g - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="#6B7280" font-family="Roboto,Arial">${v}</text>`; });
  toutes.forEach((g, j) => {
    const x = m.g + j * W + 4, r = resume(a.id, g.id);
    if (j > 0 && g.annee !== toutes[j - 1].annee) svg += `<line x1="${x - 4}" x2="${x - 4}" y1="${m.h}" y2="${H - m.b + 4}" stroke="#14365D" stroke-width="1.5"/>`;
    if (r) { const b = bande(r.note); svg += `<rect x="${x}" y="${y(r.note)}" width="${W - 8}" height="${y(0) - y(r.note)}" rx="3" fill="${COUL_BANDE[b]}" ${r.valide ? '' : 'fill-opacity=".45"'}/><text x="${x + (W - 8) / 2}" y="${y(r.note) - 3}" text-anchor="middle" font-size="9" font-weight="700" fill="#14365D" font-family="Montserrat,Arial">${f1(r.note)}</text>`; }
    svg += `<text x="${x + (W - 8) / 2}" y="${H - m.b + 14}" text-anchor="middle" font-size="9" fill="#2B2F33" font-family="Roboto,Arial">${g.num.replace('bis', 'b').replace('ter', 't')}</text>`;
  });
  const x1 = m.g + toutes.filter(g => g.annee === 1).length * W / 2, x2 = m.g + (toutes.filter(g => g.annee === 1).length + toutes.filter(g => g.annee === 2).length / 2) * W;
  svg += `<text x="${x1}" y="${H - 6}" text-anchor="middle" font-size="10" font-weight="700" fill="#14365D" font-family="Roboto,Arial">1re année</text><text x="${x2}" y="${H - 6}" text-anchor="middle" font-size="10" font-weight="700" fill="#14365D" font-family="Roboto,Arial">2e année</text></svg>`;
  // Compétences
  const comp = {}, soc = {}; const obsL = [];
  toutes.forEach(g => {
    const e = ev(a.id, g.id); if (!e) return;
    g.blocs.forEach(b => b.taches.forEach(t => t.postes.forEach(p => { const lv = MAP_T[e.m[p.id]]; if (lv && lv.c != null) { const c = comp[b.code] || (comp[b.code] = { lib: b.libelle, s: 0, n: 0, pp: new Set() }); c.s += lv.c; c.n++; c.pp.add(nomPP(g) + (g.annee === 2 ? ' (2e)' : '')); } })));
    g.socio.forEach(p => { const lv = MAP_S[e.s[p.id]]; if (lv && lv.c != null) { const lib = p.label.replace(/\s*\(.*\)$/, ''); const c = soc[lib] || (soc[lib] = { s: 0, n: 0 }); c.s += lv.c; c.n++; } });
    const r = resume(a.id, g.id);
    if (r) obsL.push(`<div><b>${libAnnee(g.annee)} · ${nomPP(g)}${e.d ? ' · ' + dateFr(e.d) : ''} · ${f1(r.note)}/20</b>${esc(observation(g, e, r))}</div>`);
  });
  const barre = (s) => { const b = bande(s * 20); return `<div class="b"><i style="width:${Math.round(s * 100)}%;background:${COUL_BANDE[b]}"></i></div><div class="p num">${Math.round(s * 100)} %</div>`; };
  const compH = Object.keys(comp).sort((p, q) => p.localeCompare(q, 'fr', { numeric: true })).map(k => { const c = comp[k]; return `<div class="comp"><span class="c">${k}</span><span class="l">${esc(c.lib)}<small>${c.n} poste${c.n > 1 ? 's' : ''} · ${[...c.pp].join(', ')}</small></span>${barre(c.s / c.n)}</div>`; }).join('');
  const socH = Object.keys(soc).map(k => `<div class="comp"><span class="c" style="background:var(--violet)">SP</span><span class="l">${esc(k)}<small>${soc[k].n} évaluation${soc[k].n > 1 ? 's' : ''}</small></span>${barre(soc[k].s / soc[k].n)}</div>`).join('');
  const notes = toutes.map(g => resume(a.id, g.id)).filter(Boolean);
  return `<div class="vue-titre"><div class="sel-app"><button data-a="prec" ${i <= 0 ? 'disabled' : ''} aria-label="Apprenti précédent">${ICO.gauche}</button>
      <select data-i="apprenti" aria-label="Apprenti">${apps.map(x => `<option value="${x.id}" ${x.id === a.id ? 'selected' : ''}>${esc(x.nom)} ${esc(x.prenom)}</option>`).join('')}</select>
      <button data-a="suiv" ${i >= apps.length - 1 ? 'disabled' : ''} aria-label="Apprenti suivant">${ICO.droite}</button></div><span class="sp"></span>
      <div class="kpi"><b class="num">${notes.length ? f1(notes.reduce((s, x) => s + x.note, 0) / notes.length) : '—'}</b><span>moyenne · ${notes.length} fiche${notes.length > 1 ? 's' : ''}</span></div></div>
    <div class="suivi"><div style="display:flex;flex-direction:column;gap:14px;min-width:0">
      <div class="carte graph"><h3>Notes par pratique professionnelle</h3>${svg}</div>
      <div class="carte"><h3>Observations</h3><div class="obs-liste">${obsL.join('') || '<p class="vide-msg">Pas encore d\'observation.</p>'}</div></div></div>
      <div class="carte"><h3>Acquisition par compétence</h3><p class="vide-msg" style="padding-top:0">Moyenne des postes évalués : A = 100 %, EC = 67 %, NM = 33 %, NA = 0 %.</p>
        ${compH || '<p class="vide-msg">Aucun poste évalué pour l\'instant.</p>'}${socH ? `<h3 style="margin-top:12px">Compétences socio-professionnelles</h3>${socH}` : ''}</div></div>`;
}

/* ================= Petits éléments d'interface ================= */
let tToast = null;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tToast); tToast = setTimeout(() => t.classList.remove('on'), 2400); }
function fermerPop() { const p = $('#pop'); if (p) p.remove(); }
function pop(ancre, items) {
  fermerPop();
  const p = document.createElement('div'); p.id = 'pop';
  p.innerHTML = items.map((it, i) => `<button data-pi="${i}">${it.c ? `<i style="background:${it.c}"></i>` : ''}${esc(it.l)}</button>`).join('');
  document.body.appendChild(p);
  const r = ancre.getBoundingClientRect(), pw = p.offsetWidth, ph = p.offsetHeight;
  let x = Math.min(r.right - pw, innerWidth - pw - 8); x = Math.max(8, x);
  let y = r.bottom + 6; if (y + ph > innerHeight - 8) y = Math.max(8, r.top - ph - 6);
  p.style.left = x + 'px'; p.style.top = y + 'px';
  p.addEventListener('click', ev2 => { const b = ev2.target.closest('[data-pi]'); if (!b) return; ev2.stopPropagation(); fermerPop(); items[+b.dataset.pi].f(); });
  setTimeout(() => document.addEventListener('click', fermerPop, { once: true }), 0);
}
function modale(html, boutons) {
  const v = document.createElement('div'); v.id = 'voile';

function marquer(sc, pid, k) {
  const a = apprenti(); if (!a) return;
  const e = ev(a.id, S.grille, true), cible = sc === 's' ? e.s : e.m;
  if (cible[pid] === k) delete cible[pid]; else cible[pid] = k;
  if (!e.d) { e.d = auj(); const d = $('#in-date'); if (d) d.value = e.d; }

  if (row) { row.querySelectorAll('.niv button').forEach(b => b.setAttribute('aria-pressed', String(cible[pid] === b.dataset.k))); row.classList.toggle('vide', !cible[pid]); }

function remplir(bIdx, btn) {

function parseListe(txt) {
  return txt.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    l = l.replace(/^\d+\s*[-–.)]?\s*/, '');
    let p = l.split(/\t|;/).map(s => s.trim()).filter(Boolean);
    if (p.length >= 2) return { nom: p[0].toUpperCase(), prenom: p.slice(1).join(' ') };
    const mots = l.split(/\s+/); const nom = []; let k = 0;
    while (k < mots.length - 1 && mots[k] === mots[k].toUpperCase() && /[A-ZÀ-Ý]/.test(mots[k])) nom.push(mots[k++]);
    if (!nom.length) { nom.push(mots[0]); k = 1; }
    return { nom: nom.join(' ').toUpperCase(), prenom: mots.slice(k).join(' ') };
  });
}

function reduireImage(fichier, max = 1280) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(fichier), img = new Image();
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.78)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('image')); };
    img.src = url;
  });
}
async function ajouterPhoto(input) {
  const f = input.files && input.files[0]; if (!f) return;
  try { await enregistrerPhoto(await reduireImage(f)); fermerCamera(); }
  catch (e) { toast("Cette image n'a pas pu être lue"); }
}

function telecharger(blob, nom) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nom; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}
async function sauvegarder() {
  const photos = await phTout();
  S.derniereSauvegarde = new Date().toISOString();
  const data = { app: 'evaluation-atelier', version: 1, date: S.derniereSauvegarde, auteur: 'Pascal AMET', etat: S, photos };
  telecharger(new Blob([JSON.stringify(data)], { type: 'application/json' }), `sauvegarde-evaluation-atelier-${auj()}.json`);
  sauver(); render(); toast('Sauvegarde enregistrée dans les téléchargements');
}
function restaurer(input) {
  const f = input.files && input.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    let d; try { d = JSON.parse(r.result); } catch (e) { return toast("Ce fichier n'est pas une sauvegarde de l'appli"); }
    if (!d || d.app !== 'evaluation-atelier' || !d.etat) return toast("Ce fichier n'est pas une sauvegarde de l'appli");
    const nbA = (d.etat.groupes || []).reduce((s, g) => s + g.apprentis.length, 0);
    confirmer('Remplacer les données de la tablette ?', `La sauvegarde du ${dateFr((d.date || '').slice(0, 10))} contient ${(d.etat.groupes || []).length} groupe(s) et ${nbA} apprenti(s). Les données actuelles seront remplacées.`, 'Remplacer', async () => {
      const ph = await phTout(); for (const k of Object.keys(ph)) await phDel(k);
      for (const [k, v] of Object.entries(d.photos || {})) await phSet(k, v);
      S = Object.assign(etatVide(), d.etat); S.vue = 'evaluer'; sauver(); render(); toast('Sauvegarde ouverte');
    });
  };
  r.readAsText(f);
}

function construireClasseur() {
  const apps = apprentis(), toutes = ORIGINE.map(o => grille(o.id)), H = v => ({ v, s: 1 });

  const detail = [[H('Nom'), H('Prénom'), H('Année'), H('Pratique'), H('Intitulé'), H('Période CFA'), H('Date'), H('Note /20'), H('% évalué'), H('Validité'), H('Appréciation globale'), H('Observations du travail réalisé')]];
  const postes = [[H('Nom'), H('Prénom'), H('Année'), H('Pratique'), H('Compétence'), H('Tâche'), H('Poste contrôlé'), H('Tolérance'), H('Niveau'), H('Observation')]];
  const codes = new Set(); toutes.forEach(g => g.blocs.forEach(b => codes.add(b.code)));
  const listeCodes = [...codes].sort((p, q) => p.localeCompare(q, 'fr', { numeric: true }));
  const comp = [[H('Nom'), H('Prénom'), ...listeCodes.map(c => H(c)), H('Socio-pro')]];
  for (const a of apps) {
    const moy = an => { const ok = toutes.filter(g => g.annee === an).map(g => resume(a.id, g.id)).filter(Boolean); return ok.length ? { note: ok.reduce((s, x) => s + x.note, 0) / ok.length } : null; };
    notes.push([a.nom, a.prenom, ...toutes.map(g => noteC(resume(a.id, g.id))), noteC(moy(1)), noteC(moy(2))]);
    const acc = {}, so = { s: 0, n: 0 };
    for (const g of toutes) {
      const e = ev(a.id, g.id); if (!e) continue; const r = resume(a.id, g.id); if (!r) continue;
      detail.push([a.nom, a.prenom, libAnnee(g.annee), nomPP(g), g.titre, e.per || '', dateFr(e.d), noteC(r), { v: Math.round(r.pct * 100) / 100, s: 8 }, r.valide ? 'Valable' : 'Moins de 2/3 évalués', e.ap || appreciationAuto(r.note), observation(g, e, r)]);
      g.blocs.forEach(b => b.taches.forEach(t => t.postes.forEach(p => { const lv = MAP_T[e.m[p.id]]; if (lv) postes.push([a.nom, a.prenom, libAnnee(g.annee), nomPP(g), b.code + ' – ' + b.libelle, t.nom, p.label, p.tol, lv.lib, (e.o || {})[p.id] || '']); if (lv && lv.c != null) { const c = acc[b.code] || (acc[b.code] = { s: 0, n: 0 }); c.s += lv.c; c.n++; } })));
      g.socio.forEach(p => { const lv = MAP_S[e.s[p.id]]; if (lv) postes.push([a.nom, a.prenom, libAnnee(g.annee), nomPP(g), 'Socio-professionnel', '', p.label, '', lv.lib, (e.o || {})[p.id] || '']); if (lv && lv.c != null) { so.s += lv.c; so.n++; } });
    }
    comp.push([a.nom, a.prenom, ...listeCodes.map(c => acc[c] ? { v: Math.round(acc[c].s / acc[c].n * 100) / 100, s: 8 } : ''), so.n ? { v: Math.round(so.s / so.n * 100) / 100, s: 8 } : '']);
  }

    { nom: 'Notes', lignes: notes, largeurs: [18, 14, ...toutes.map(() => 9.5), 11, 11], figer: [2, 1] },
    { nom: 'Détail des fiches', lignes: detail, largeurs: [18, 14, 10, 10, 50, 12, 11, 9, 9, 18, 34, 50], figer: [2, 1] },

}

/* Version en ligne (https) : appli installable sur la tablette, utilisable ensuite sans Internet */
function modeInstallable() {
  const enLigne = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (!enLigne || !('serviceWorker' in navigator)) return;
  const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.webmanifest'; document.head.appendChild(l);
  navigator.serviceWorker.register('sw.js').catch(() => { });
  let deja = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (deja) toast("Nouvelle version de l'appli installée : elle s'affichera à la prochaine ouverture"); deja = true; });
}
(async function demarrer() {
  modeInstallable();
  charger();
  await phOuvrir();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
  render();
})();
